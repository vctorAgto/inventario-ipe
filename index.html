<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balcão de Literatura — Congregação Ipê</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <img src="logo.png" alt="Símbolo da Congregação Ipê" class="brandmark">
    <div class="brandtext">
      <p class="eyebrow">Congregação Ipê · Consulta</p>
      <h1>Balcão de Literatura</h1>
      <p class="updated-note" id="statusbar">Carregando...</p>
    </div>
    <div class="head-actions no-print">
      <a class="badge-link" href="editor.html">Editar →</a>
    </div>
  </header>

  <div id="surveyCard"></div>
  <div class="dash" id="dash"></div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Buscar por título ou código (ex: bt, Sentinela)…">
    <div class="segmented" id="viewSeg">
      <button data-view="list" class="on">☰ Lista</button>
      <button data-view="cards">▦ Capas</button>
      <button data-view="compare">⇄ Comparar</button>
      <button data-view="print">🖨 Imprimir</button>
    </div>
  </div>

  <div class="chips" id="chips"></div>
  <div id="content"></div>
  <div class="print-area" id="printArea"></div>

  <footer>Dados atualizados pela equipe do balcão · Congregação Ipê</footer>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lightboxClose" aria-label="Fechar">×</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script src="shared.js"></script>
<script>
let data = normalizePayload({});
let activeCat = null;      // null = todas
let filter = null;         // null | 'pendente' | 'attention'
let searchTerm = '';
let view = 'list';
let onlyChanged = false;

const $ = (id) => document.getElementById(id);

async function loadData(){
  try{
    const res = await fetch('./data.json?t=' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    data = normalizePayload(await res.json());
    $('statusbar').textContent = data.updatedAt ? ('Atualizado em ' + formatDateTime(data.updatedAt)) : 'Dados carregados';
    $('statusbar').classList.remove('error');
    render();
  }catch(e){
    $('statusbar').textContent = 'Não foi possível carregar os dados agora. Tente de novo em instantes.';
    $('statusbar').classList.add('error');
  }
}

function renderSurvey(){
  const month = currentMonth();
  const items = data.items;
  const done = items.filter(isCounted).length;
  const total = items.length;
  const closed = data.survey.month === month && data.survey.closedAt && done === total;
  const pct = total ? Math.round(done / total * 100) : 0;
  const cats = itemsByCategory(items).map(({ cat, items: l }) => {
    const c = l.filter(isCounted).length;
    return `<div class="survey-cat ${c === l.length ? 'complete' : ''}" style="${catStyle(cat)}"><span>${CAT_SHORT[cat]}</span><span>${c}/${l.length}</span></div>`;
  }).join('');
  $('surveyCard').innerHTML = `<section class="survey-card ${closed ? 'done' : ''}">
    <div class="survey-top">
      <div>
        <h2>Levantamento de ${monthLabel(month)}</h2>
        <p>${closed
          ? `Concluído em ${formatDateTime(data.survey.closedAt)}${data.survey.closedBy ? ' por ' + esc(data.survey.closedBy) : ''}.`
          : done === 0 ? 'Ainda não começou. A contagem é feita no começo de cada mês.' : 'Contagem em andamento.'}</p>
      </div>
    </div>
    <div class="progress-outer"><div class="progress-inner" style="width:${pct}%"></div></div>
    <div class="survey-meta"><span><b>${done}</b> de ${total} itens contados</span><span>${pct}%</span></div>
    <div class="survey-cats">${cats}</div>
  </section>`;
}

function renderDash(){
  const items = data.items;
  const totalQty = items.reduce((s, it) => s + (Number(it.quantity) || 0), 0);
  const pend = items.filter(it => !isCounted(it)).length;
  const att = items.filter(needsAttention).length;
  const on = (f) => filter === f ? 'active' : '';
  $('dash').innerHTML = `
    <button class="stat ${filter === null && !activeCat ? 'active' : ''}" data-f="">
      <div class="n">${items.length}</div><div class="l">Itens</div></button>
    <button class="stat" data-f="">
      <div class="n">${fmt(totalQty)}</div><div class="l">Exemplares</div></button>
    <button class="stat ${on('pendente')}" data-f="pendente">
      <div class="n">${pend}</div><div class="l">Pendentes</div></button>
    <button class="stat ${on('attention')}" data-f="attention">
      <div class="n">${att}</div><div class="l">Pedir / em falta</div></button>`;
  $('dash').querySelectorAll('.stat').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.f || null;
    activeCat = null;
    render();
  }));
}

function baseList(){
  let list = data.items;
  if(searchTerm){
    const t = searchTerm.toLowerCase();
    list = list.filter(it => it.title.toLowerCase().includes(t) || it.code.toLowerCase().includes(t));
  }
  if(filter === 'pendente') list = list.filter(it => !isCounted(it));
  if(filter === 'attention') list = list.filter(needsAttention);
  return list;
}
function visibleList(){
  const list = baseList();
  return activeCat ? list.filter(it => it.cat === activeCat) : list;
}

function renderChips(){
  const list = baseList();
  const chip = (cat) => {
    const n = cat ? list.filter(it => it.cat === cat).length : list.length;
    const on = activeCat === cat ? 'on' : '';
    return cat
      ? `<button class="chip ${on}" data-cat="${esc(cat)}" style="${catStyle(cat)}">${CAT_SHORT[cat]} <span class="cnt">${n}</span></button>`
      : `<button class="chip all ${on}" data-cat="">Todas <span class="cnt">${n}</span></button>`;
  };
  $('chips').innerHTML = chip(null) + CATEGORIES.map(chip).join('');
  $('chips').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    activeCat = b.dataset.cat || null;
    render();
  }));
}

function rowHTML(it){
  const st = itemState(it);
  const sub = [
    `<span class="pill ${st}">${STATE_LABEL[st]}</span>`,
    it.reorder ? '<span class="pill pedir">Pedir mais</span>' : '',
    it.lastChecked ? `<span>contado em ${esc(String(it.lastChecked).slice(0, 10))}</span>` : '',
    it.note ? `<span class="rnote">${esc(it.note)}</span>` : ''
  ].join('');
  return `<div class="irow" style="${catStyle(it.cat)}">
    ${thumbHTML(it)}
    <div class="rmain">
      <div class="rtitle"><span class="code">${esc(it.code)}</span>${esc(it.title)}</div>
      <div class="rsub">${sub}</div>
    </div>
    <div class="rqty ${st === 'pendente' ? 'pend' : ''}" title="${st === 'pendente' ? 'Valor do último levantamento' : ''}">${fmt(it.quantity)}</div>
  </div>`;
}

function cardHTML(it){
  const st = itemState(it);
  const cover = it.image
    ? `<img src="${esc(it.image)}" alt="${esc(it.title)}" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(it.code)}'))">`
    : `<span>${esc(it.code)}</span>`;
  return `<div class="card" style="${catStyle(it.cat)}">
    <div class="cover">${cover}</div>
    <div class="rtitle"><span class="code">${esc(it.code)}</span>${esc(it.title)}</div>
    <div class="foot"><span class="pill ${st}">${STATE_LABEL[st]}</span><span class="rqty ${st === 'pendente' ? 'pend' : ''}">${fmt(it.quantity)}</span></div>
  </div>`;
}

function renderContent(){
  const list = visibleList();
  const el = $('content');
  if(view === 'compare'){
    el.innerHTML = `<div class="row" style="justify-content:flex-end;margin-bottom:8px;">
        <label class="check"><input type="checkbox" id="onlyChanged" ${onlyChanged ? 'checked' : ''}> Mostrar só o que mudou</label>
      </div>` + compareHTML(list, data.history, { onlyChanged });
    $('onlyChanged').addEventListener('change', (e) => { onlyChanged = e.target.checked; renderContent(); });
    return;
  }
  if(!list.length){
    el.innerHTML = '<div class="empty">Nenhum item encontrado.</div>';
    return;
  }
  el.innerHTML = itemsByCategory(list).filter(g => g.items.length).map(({ cat, items }) => {
    const qty = items.reduce((s, it) => s + (Number(it.quantity) || 0), 0);
    const body = view === 'cards'
      ? `<div class="grid">${items.map(cardHTML).join('')}</div>`
      : `<div class="rows">${items.map(rowHTML).join('')}</div>`;
    return `<section class="group" style="${catStyle(cat)}">
      <div class="group-title"><span>${esc(cat)}</span><small>${items.length} itens · ${fmt(qty)} exemplares</small></div>
      ${body}
    </section>`;
  }).join('');
}

function renderPrintArea(){
  const list = visibleList();
  const groups = itemsByCategory(list).filter(g => g.items.length).map(({ cat, items }) => `
    <tbody style="${catStyle(cat)}">
      <tr class="cat-row"><th colspan="4">${esc(cat)}</th></tr>
      ${items.map(it => `<tr>
        <td class="mono">${esc(it.code)}</td><td>${esc(it.title)}</td>
        <td class="num">${fmt(it.quantity)}</td><td>${STATE_LABEL[itemState(it)]}${it.reorder ? ' · pedir mais' : ''}</td>
      </tr>`).join('')}
    </tbody>`).join('');
  $('printArea').innerHTML = `<h2 style="margin:0 0 8px;">Inventário — ${monthLabel(currentMonth())}</h2>
    <div class="table-scroll"><table class="inv-table">
      <thead><tr><th>Código</th><th>Título</th><th class="num">Qtd.</th><th>Situação</th></tr></thead>${groups}
    </table></div>`;
}

$('viewSeg').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
  if(b.dataset.view === 'print'){
    renderPrintArea();
    window.print();
    return;
  }
  view = b.dataset.view;
  $('viewSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  renderContent();
}));

$('search').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim();
  renderChips();
  renderContent();
});

const lightboxEl = $('lightbox');
function openLightbox(src){
  $('lightboxImg').src = src;
  lightboxEl.hidden = false;
}
function closeLightbox(){ lightboxEl.hidden = true; $('lightboxImg').src = ''; }
lightboxEl.addEventListener('click', closeLightbox);
window.addEventListener('keydown', (e) => { if(e.key === 'Escape' && !lightboxEl.hidden) closeLightbox(); });
$('content').addEventListener('click', (e) => {
  if(e.target.tagName === 'IMG' && (e.target.closest('.rthumb') || e.target.closest('.cover'))) openLightbox(e.target.src);
});

function render(){
  renderSurvey();
  renderDash();
  renderChips();
  renderContent();
}

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
